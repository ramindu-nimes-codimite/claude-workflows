name: Claude Code (reusable)

# Central, org-wide Claude Code workflow.
# Called by a thin caller workflow in each repo — see README.md for the full
# snippet. The caller resolves each developer's CLAUDE_TOKEN_<USERNAME> secret
# name and passes the token in explicitly.
#
# The triggering event's context (comment body, actor, PR, etc.) is available
# here automatically, so all `if:` conditions work exactly as they did in a
# per-repo workflow.
#
# ---------------------------------------------------------------------------
# What you get when you mention @claude
# ---------------------------------------------------------------------------
# A single `dispatch` job parses the mention into exactly ONE mode, and each
# downstream job is gated on that mode. Modes are mutually exclusive — one
# mention can never start two Claude runs.
#
#   @claude                     → reply with the list of available commands
#   @claude review              → review the PR (docs context + inline comments)
#   @claude fix <description>   → implement the change and push a commit
#   @claude ask <question>      → answer only; never edits files
#   @claude audit                → summarize a dependency bump: vulnerability
#                                   fixed, affected files, new features, deprecations
#   @claude <anything else>     → `ask` (the safe default — nothing is written)
#
# `audit` also runs automatically when Dependabot/Renovate opens a PR (see
# auto_dependency_audit below).
#
# Model selection composes with every command:
#   @claude-opus review         → review with Opus
#   @claude-haiku fix <desc>    → fix with Haiku
#
# Filler words between the mention and the command are ignored, so
# "@claude please review this" and "@claude can you fix the flaky test" work.

on:
  workflow_call:
    inputs:
      auto_pr_review:
        description: >-
          Controls the automatic PR review that runs on pull_request events.
          Callers pass their own CLAUDE_AUTO_PR_REVIEW repository variable
          here. `false`, `0`, `off`, `no`, or `disabled` (case-insensitive)
          disables it; anything else leaves it enabled.
        type: string
        required: false
        default: 'true'
      auto_dependency_audit:
        description: >-
          Controls the automatic dependency audit that runs when Dependabot
          or Renovate opens a pull request. Callers pass their own
          CLAUDE_AUTO_DEPENDENCY_AUDIT repository variable here. `false`,
          `0`, `off`, `no`, or `disabled` (case-insensitive) disables it;
          anything else leaves it enabled.
        type: string
        required: false
        default: 'true'
    secrets:
      actor_token:
        description: >-
          Long-lived Claude Code token belonging to the user who triggered the
          run (github.actor). Optional so a missing token produces this
          workflow's actionable error instead of a caller-side failure.
        required: false
      pr_author_token:
        description: >-
          Long-lived Claude Code token belonging to the pull request author,
          used by the review job.
        required: false

jobs:
  # ---------------------------------------------------------------------------
  # Single source of truth: parse the mention into exactly one mode.
  # ---------------------------------------------------------------------------
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      # One of: review | fix | ask | help | audit | none
      mode: ${{ steps.parse.outputs.mode }}
      # The mention that was actually typed (@claude, @claude-opus, @claude-haiku).
      # The action only responds to comments containing its trigger phrase, so
      # the matched mention has to be passed through verbatim.
      mention: ${{ steps.parse.outputs.mention }}
      # `--model opus` / `--model haiku`, or empty for the default model.
      model_args: ${{ steps.parse.outputs.model_args }}
    steps:
      # Every output below is one of a fixed set of literals chosen by a `case`
      # statement — no comment text is ever written to $GITHUB_OUTPUT, so a
      # crafted comment body cannot forge a mode or inject extra outputs.
      - name: Parse mention into a mode
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          AUTO_PR_REVIEW: ${{ inputs.auto_pr_review }}
          AUTO_DEPENDENCY_AUDIT: ${{ inputs.auto_dependency_audit }}
          # PR author login for pull_request events — used to detect a
          # Dependabot/Renovate bump vs. a human-authored PR.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # PR base branch for pull_request events — used to force an audit
          # on anything landing on a release branch, regardless of author.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Who triggered this run — `Bot` for anything posted by an app.
          SENDER_TYPE: ${{ github.event.sender.type }}
          # The text that carried the @claude mention, per event type.
          TEXT: >-
            ${{ github.event.comment.body ||
                github.event.review.body ||
                format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
        run: |
          set -euo pipefail

          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # --- pull_request events carry no mention: automatic review, or
          # --- automatic dependency audit when either the PR author is a
          # --- known dependency bot (Dependabot/Renovate) or the PR targets
          # --- a release branch (release, release/*, releases/*) — any
          # --- dependency drift landing on a release branch gets audited
          # --- regardless of who opened the PR.
          if [ "$EVENT" = 'pull_request' ]; then
            pr_author_lower=$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
            base_ref_lower=$(printf '%s' "$BASE_REF" | tr '[:upper:]' '[:lower:]')

            is_dependency_bot=false
            case "$pr_author_lower" in
              'dependabot[bot]'|'renovate[bot]') is_dependency_bot=true ;;
            esac

            is_release_branch=false
            case "$base_ref_lower" in
              release|release/*|releases/*) is_release_branch=true ;;
            esac

            if [ "$is_dependency_bot" = true ] || [ "$is_release_branch" = true ]; then
              case "$(printf '%s' "$AUTO_DEPENDENCY_AUDIT" | tr '[:upper:]' '[:lower:]')" in
                false|0|off|no|disabled) mode=none ;;
                *)                       mode=audit ;;
              esac
            else
              case "$(printf '%s' "$AUTO_PR_REVIEW" | tr '[:upper:]' '[:lower:]')" in
                false|0|off|no|disabled) mode=none ;;
                *)                       mode=review ;;
              esac
            fi

            emit mode "$mode"
            emit mention ''
            emit model_args ''
            echo "pull_request event (author=$PR_AUTHOR, base=$BASE_REF) -> mode=$mode"
            exit 0
          fi

          # --- Never act on a mention posted by an app. Our own comments quote
          # --- the commands verbatim (the help reply below lists them, and a
          # --- review summary suggests "@claude fix …"), so without this guard
          # --- Claude would answer itself. Checked after the pull_request
          # --- branch above so bot-opened PRs are still reviewed.
          if [ "$SENDER_TYPE" = 'Bot' ]; then
            emit mode none
            emit mention ''
            emit model_args ''
            echo "Mention came from a bot sender -> mode=none"
            exit 0
          fi

          lower=$(printf '%s' "$TEXT" | tr -d '\r' | tr '[:upper:]' '[:lower:]')

          # --- Which mention was used? Longest first, so "@claude-opus" is
          # --- never mis-read as a bare "@claude".
          mention='' model=''
          for candidate in '@claude-opus:opus' '@claude-haiku:haiku' '@claude:'; do
            token=${candidate%%:*}
            # Require a word boundary either side so "@claudebot" and an
            # email-style "foo/@claude" do not trigger a run.
            if [[ "$lower" =~ (^|[^a-z0-9_/-])"$token"([^a-z0-9_-]|$) ]]; then
              mention=$token
              model=${candidate#*:}
              break
            fi
          done

          if [ -z "$mention" ]; then
            emit mode none
            emit mention ''
            emit model_args ''
            echo "No @claude mention found -> mode=none"
            exit 0
          fi

          # --- Which command follows the mention? Skip conversational filler
          # --- so "@claude please review this" still resolves to `review`.
          rest=${lower#*"$mention"}
          cmd=''
          for word in $(printf '%s' "$rest" | tr -c 'a-z0-9' ' '); do
            case "$word" in
              please|pls|plz|can|could|would|will|you|kindly|now|also|just|\
              go|ahead|and|then|hey|hi|ok|okay|lets|let|us) continue ;;
            esac
            cmd=$word
            break
          done

          case "$cmd" in
            review|reviews|rereview)     mode=review ;;
            fix|fixes|implement|apply)   mode=fix ;;
            ask|explain|question|answer) mode=ask ;;
            audit|vulnerability|vuln|dependency|dependencies|deps) mode=audit ;;
            # Nothing after the mention but filler: the user is asking what
            # Claude can do, so reply with the command list instead of burning
            # a full run on an empty question.
            '')                          mode=help ;;
            # A command we don't recognise is a question: answer only. Writing
            # to the branch always requires typing `fix` explicitly.
            *)                           mode=ask ;;
          esac

          emit mode "$mode"
          emit mention "$mention"
          if [ -n "$model" ]; then
            emit model_args "--model $model"
            echo "mention=$mention command='${cmd:-<none>}' -> mode=$mode model=$model"
          else
            emit model_args ''
            echo "mention=$mention command='${cmd:-<none>}' -> mode=$mode model=<default>"
          fi

  # ---------------------------------------------------------------------------
  # HELP — a bare mention. Posts the command list directly with the GitHub
  # token; no Claude run, no developer token, nothing to check out.
  # ---------------------------------------------------------------------------
  claude-help:
    needs: dispatch
    if: needs.dispatch.outputs.mode == 'help'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post the available commands
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Comment events carry `issue`; review events carry `pull_request`.
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          # One of the three fixed mention literals — echoed back so a
          # `@claude-opus` mention documents itself with `@claude-opus`.
          MENTION: ${{ needs.dispatch.outputs.mention }}
        run: |
          set -euo pipefail

          # Quoted heredoc: the body is a template, so backticks stay literal.
          # {{M}} is substituted afterwards rather than expanded by the shell.
          cat > help.md << 'EOF'
          **Available commands** — say what you want after the mention:

          | You type | What happens | Can it change code? |
          | --- | --- | --- |
          | `{{M}} review` | Reviews the PR against this repo's docs, leaves inline comments plus a summary | No |
          | `{{M}} fix <description>` | Implements the change and commits it | **Yes** |
          | `{{M}} ask <question>` | Investigates and answers in a comment | No |
          | `{{M}} audit` | Summarizes a dependency bump: vulnerability fixed, affected files in this repo, new features, deprecations | No |
          | `{{M}} <anything else>` | Treated as `ask` — nothing is written | No |

          `audit` also runs automatically when Dependabot/Renovate opens a PR.

          Pick a model by extending the mention — this composes with every
          command: `@claude-opus review`, `@claude-haiku fix <description>`.
          Plain `@claude` uses the default model.

          Conversational filler is ignored, so `{{M}} please review this` and
          `{{M}} can you fix the flaky test` both work. Landing a change always
          requires typing `fix` explicitly.
          EOF

          sed -i "s/{{M}}/$MENTION/g" help.md
          gh api "repos/$REPO/issues/$NUMBER/comments" -f "body=$(cat help.md)" --silent
          echo "Posted the command list to $REPO#$NUMBER"

  # ---------------------------------------------------------------------------
  # ASK — answer only. Read-only at the permission level, so nothing this job
  # does can reach the branch even if the prompt is subverted.
  # ---------------------------------------------------------------------------
  claude-ask:
    needs: dispatch
    if: needs.dispatch.outputs.mode == 'ask'
    runs-on: ubuntu-latest
    permissions:
      contents: read # deliberately read-only: `ask` never commits
      pull-requests: write # post the answer
      issues: write # post the answer on issues
      id-token: write
      actions: read # let Claude read CI results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure developer token exists
        env:
          DEV_TOKEN: ${{ secrets.actor_token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$DEV_TOKEN" ]; then
            name="CLAUDE_TOKEN_$(printf '%s' "$ACTOR" | tr '[:lower:]-' '[:upper:]_')"
            echo "::error::No Claude token found for '$ACTOR'." \
              "Add a repository secret named '$name' with a long-lived token" \
              "(https://code.claude.com/docs/en/authentication#generate-a-long-lived-token)."
            exit 1
          fi

      - name: Run Claude Code (ask)
        uses: anthropics/claude-code-action@v1.0.66
        with:
          claude_code_oauth_token: ${{ secrets.actor_token }}
          trigger_phrase: ${{ needs.dispatch.outputs.mention }}
          additional_permissions: |
            actions: read
          # Editing tools are blocked outright, and the job has no `contents:
          # write` to push with — the system prompt just makes the contract
          # explicit so Claude explains the change instead of attempting it.
          claude_args: |
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
            --append-system-prompt "MODE: ASK. Answer the request in your comment and do not change the repository. Read code, tests, and CI results as needed, but never create, edit, or delete files, and never commit or push. If answering well requires a code change, describe precisely what change is needed and tell the user to re-run with '@claude fix <description>' to have it applied."
            ${{ needs.dispatch.outputs.model_args }}

  # ---------------------------------------------------------------------------
  # FIX — implement the requested change and push a commit to the PR branch.
  # ---------------------------------------------------------------------------
  claude-fix:
    needs: dispatch
    if: needs.dispatch.outputs.mode == 'fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to commit and push the fix
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure developer token exists
        env:
          DEV_TOKEN: ${{ secrets.actor_token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$DEV_TOKEN" ]; then
            name="CLAUDE_TOKEN_$(printf '%s' "$ACTOR" | tr '[:lower:]-' '[:upper:]_')"
            echo "::error::No Claude token found for '$ACTOR'." \
              "Add a repository secret named '$name' with a long-lived token" \
              "(https://code.claude.com/docs/en/authentication#generate-a-long-lived-token)."
            exit 1
          fi

      - name: Run Claude Code (fix)
        uses: anthropics/claude-code-action@v1.0.66
        with:
          claude_code_oauth_token: ${{ secrets.actor_token }}
          trigger_phrase: ${{ needs.dispatch.outputs.mention }}
          additional_permissions: |
            actions: read
          claude_args: |
            --append-system-prompt "MODE: FIX. Implement the change the user asked for and commit it to this pull request's branch. Deliver exactly the requested scope: do not refactor surrounding code, add abstractions, or fix unrelated problems you notice — mention those in your comment instead. Follow the conventions already used in the files you touch. Run the project's existing tests or linters for the code you changed if they are available, and report the actual result. When you are done, comment with what you changed and why. If the request is too ambiguous to implement safely, make no commit and ask for the missing detail."
            ${{ needs.dispatch.outputs.model_args }}

  # ---------------------------------------------------------------------------
  # REVIEW — the PR reviewer. Runs automatically on pull_request events (unless
  # the caller disables it) and on demand via `@claude review`.
  # ---------------------------------------------------------------------------
  claude-review:
    needs: dispatch
    if: needs.dispatch.outputs.mode == 'review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Comment-triggered reviews act as the commenter; automatic reviews act
      # as the PR author. The caller resolves both to `pr_author_token`, which
      # falls back to github.actor when there is no pull_request payload.
      - name: Ensure developer token exists
        env:
          DEV_TOKEN: ${{ secrets.pr_author_token }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$DEV_TOKEN" ]; then
            name="CLAUDE_TOKEN_$(printf '%s' "$ACTOR" | tr '[:lower:]-' '[:upper:]_')"
            echo "::error::No Claude token found for '$ACTOR'." \
              "Add a repository secret named '$name' with a long-lived token" \
              "(https://code.claude.com/docs/en/authentication#generate-a-long-lived-token)."
            exit 1
          fi

      - name: Prepare documentation context
        id: prepare-context
        env:
          # Optional: override the docs discovered for review context.
          # Space- or newline-separated list of files/globs, relative to repo root.
          # Leave empty to auto-discover common project documentation.
          DOCS_PATHS: ${{ vars.CLAUDE_REVIEW_DOCS }}
          # Cap total context size (KB) so very large docs don't blow up the prompt.
          MAX_CONTEXT_KB: '256'
        run: |
          set -euo pipefail
          echo "Building documentation context..."

          # Build the candidate doc list: explicit override, else auto-discovery.
          declare -a CANDIDATES=()
          if [ -n "$DOCS_PATHS" ]; then
            # Expand user-provided paths/globs.
            for pattern in $DOCS_PATHS; do
              for f in $pattern; do
                [ -f "$f" ] && CANDIDATES+=("$f")
              done
            done
          else
            # Auto-discover common documentation, plus any repo-level guidance files
            # and everything under docs/. Null-delimited to survive spaces in names.
            while IFS= read -r -d '' f; do
              CANDIDATES+=("$f")
            done < <(
              {
                for f in README.md README.rst CONTRIBUTING.md ARCHITECTURE.md \
                         CLAUDE.md AGENTS.md .github/CONTRIBUTING.md; do
                  [ -f "$f" ] && printf '%s\0' "$f"
                done
                find docs -type f \( -name '*.md' -o -name '*.rst' \) -print0 2>/dev/null
              }
            )
          fi

          # Create context file header.
          cat > claude-docs-context.md << 'EOF'
          # Documentation Context for PR Review

          The following project documentation is provided as reference. Use it to
          understand conventions, architecture, and requirements when reviewing.
          If no docs are listed below, review against general best practices.

          EOF

          # Append each doc, de-duplicated and bounded by MAX_CONTEXT_KB.
          declare -A SEEN=()
          max_bytes=$((MAX_CONTEXT_KB * 1024))
          included=0
          for doc in "${CANDIDATES[@]}"; do
            [ -n "${SEEN[$doc]:-}" ] && continue
            SEEN[$doc]=1
            current=$(wc -c < claude-docs-context.md)
            if [ "$current" -ge "$max_bytes" ]; then
              echo "Reached context size cap (${MAX_CONTEXT_KB}KB); skipping remaining docs." >&2
              break
            fi
            echo "## Documentation: $doc" >> claude-docs-context.md
            echo "" >> claude-docs-context.md
            cat "$doc" >> claude-docs-context.md
            printf '\n---\n\n' >> claude-docs-context.md
            included=$((included + 1))
          done

          echo "Documentation context prepared: $included file(s), $(wc -l < claude-docs-context.md) lines."

          # Save the content to a GitHub Actions output for use in the next step.
          # The delimiter is randomised because the docs are repo content: a file
          # containing the literal delimiter must not be able to inject outputs.
          delim="DOCS_EOF_$(openssl rand -hex 16)"
          {
            echo "DOCS_CONTEXT<<$delim"
            cat claude-docs-context.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (review)
        uses: anthropics/claude-code-action@v1.0.66
        with:
          claude_code_oauth_token: ${{ secrets.pr_author_token }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            ${{ steps.prepare-context.outputs.DOCS_CONTEXT }}

            ---

            Please review this pull request. If project documentation is provided
            above, use it as the reference for conventions and requirements;
            otherwise review against general best practices for this codebase's
            language and frameworks. Focus on:
            - Adherence to the project's documented patterns and conventions
            - Correctness — potential bugs, edge cases, and regressions
            - Code quality, readability, and maintainability
            - Security implications (input validation, authz, secrets, injection)
            - Performance considerations
            - Test coverage for the changed behavior

            Review only what the diff changes; do not comment on unrelated code.
            Provide detailed, actionable feedback using inline comments for
            specific issues, and a short summary comment for overall assessment.

            This is a review only. Do not modify, commit, or push any files — if a
            fix is warranted, describe it in a comment and note that the author can
            run `@claude fix <description>` to have it applied.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            ${{ needs.dispatch.outputs.model_args }}

  # ---------------------------------------------------------------------------
  # AUDIT — summarize a dependency bump: what vulnerability it fixes, which
  # files in this repo actually use the package, what's new upstream, and
  # what's deprecated. Runs automatically on Dependabot/Renovate PRs, or on
  # demand via `@claude audit`. Read-only, same as `review`.
  # ---------------------------------------------------------------------------
  claude-audit:
    needs: dispatch
    if: needs.dispatch.outputs.mode == 'audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Comment-triggered audits act as the commenter; automatic audits (on a
      # Dependabot/Renovate PR) act as the PR author, same pattern as review.
      - name: Ensure developer token exists
        env:
          DEV_TOKEN: ${{ secrets.pr_author_token }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$DEV_TOKEN" ]; then
            name="CLAUDE_TOKEN_$(printf '%s' "$ACTOR" | tr '[:lower:]-' '[:upper:]_')"
            echo "::error::No Claude token found for '$ACTOR'." \
              "Add a repository secret named '$name' with a long-lived token" \
              "(https://code.claude.com/docs/en/authentication#generate-a-long-lived-token)."
            exit 1
          fi

      - name: Run Claude Code (dependency audit)
        uses: anthropics/claude-code-action@v1.0.66
        with:
          claude_code_oauth_token: ${{ secrets.pr_author_token }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            This pull request bumps one or more dependencies (likely a
            Dependabot/Renovate security or version update). Investigate it
            and post a single PR comment with these sections:

            1. **What changed** — for each package whose version changed in
               this diff (check the manifest/lockfile, e.g. package.json /
               yarn.lock), the old version, the new version, and whether this
               bump fixes a known CVE/security advisory (check the PR title
               and body, and the package's own advisories/changelog if you
               can reach them).
            2. **Affected areas in this repo** — grep the codebase for every
               import/usage of each bumped package and list the actual
               files/modules that depend on it. If a package is only a
               transitive dependency with no direct usage here, say so
               plainly instead of listing unrelated files.
            3. **New features** — from the package's changelog/release notes
               between the old and new version, list new capabilities that
               are relevant to how this repo already uses the package. Skip
               anything irrelevant to this codebase.
            4. **Deprecations / breaking changes** — anything marked
               deprecated or breaking between the two versions, cross-checked
               against the usage sites found in step 2. State explicitly if
               none of this repo's usage sites are affected.

            If you cannot find a changelog or release notes for a package,
            say so instead of guessing.

            This is a read-only audit. Do not modify, commit, or push any
            files — if a follow-up code change is needed because of a
            deprecation, describe it and tell the author to run
            `@claude fix <description>` to have it applied.

          claude_args: |
            --allowedTools "WebFetch,WebSearch,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*)"
            ${{ needs.dispatch.outputs.model_args }}
